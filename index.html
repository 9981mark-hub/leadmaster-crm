  <script>
    // [Global Fix] Disable Browser Scroll Restoration
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
  </script>
  <style>
    /* [Typography] Toss & Apple Standard Pretendard Font */
    html, body, button, input, select, textarea {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: -0.025em;
    }
    /* [Global Fix] Enforce instant scrolling to prevent smooth-scroll interference during restoration */
    html,
    body,
    #main-scroll-container {
      scroll-behavior: auto !important;
      overscroll-behavior-y: none;
      /* Prevent rubber-banding */
    }
    * {
      scroll-behavior: auto !important;
    }
  </style>
  <script>
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
  <!-- [2026-11-01] 본문 글꼴: Pretendard (한글·숫자 가독성, 화면에 쓰는 글자만 내려받는 dynamic subset) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    body {
      font-family: Figtree, 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background-color: #f6f7fb;
      color: #323338;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    html.dark body { 
      background-color: #09090b;
      color: #fafafa; 
    }
    /* 키보드로 움직일 때만 보이는 포커스 */
    :focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Toast Animation */
    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.3s ease-out forwards;
    }

    /* Hide number input spinners */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      -webkit-appearance: textfield;
      appearance: textfield;
    }

    /* 
         한글 입력 모드 활성화 (ime-mode)
         Note: 최신 브라우저에서는 OS 설정을 따르지만, 지원하는 환경을 위해 명시적으로 선언합니다.
      */
    input:not([type="password"]):not([type="email"]):not([type="tel"]),
    textarea {
      ime-mode: active;
    }
  </style>
